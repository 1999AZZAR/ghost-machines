services:
  ghost1:
    build:
      context: .
      dockerfile: "${GHOST_DOCKERFILE:-Dockerfile}"
      args:
        HOST_UID: "${HOST_UID:-1000}"
        HOST_GID: "${HOST_GID:-1000}"
        GHOST_USER: "${GHOST_USER:-developer}"
    image: "${GHOST_IMAGE:-ubuntu-template:latest}"
    container_name: "${G1_NAME:-ghost-machine1}"
    restart: unless-stopped
    entrypoint: ["/entrypoint.sh"]
    command: ["/usr/sbin/sshd", "-D"]
    environment:
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
      - GHOST_USER=${GHOST_USER:-developer}
      - SSH_PASSWORD_AUTH=${SSH_PASSWORD_AUTH:-true}
    ports:
      - "${G1_PORT:-2223}:22"
    volumes:
      - ${LXCFS_CPUINFO:-/dev/null}:/proc/cpuinfo:ro
      - ${LXCFS_MEMINFO:-/dev/null}:/proc/meminfo:ro
      - ${LXCFS_STAT:-/dev/null}:/proc/stat:ro
      - ${LXCFS_SWAPS:-/dev/null}:/proc/swaps:ro
      - ${LXCFS_UPTIME:-/dev/null}:/proc/uptime:ro
      - ./mounts/ubuntu1:/home/${GHOST_USER:-developer}
      - ./entrypoint.sh:/entrypoint.sh:ro
      - ${SSH_AUTH_KEY_PATH:-/dev/null}:/root/.ssh/authorized_keys:ro
      - ${MCP_ECOSYSTEM_LOCAL_PATH:-/dev/null}:/opt/mcp-ecosystem-local:ro
      - ${HOST_AGY_BIN:-/dev/null}:/usr/local/bin/agy:ro
    deploy:
      resources:
        limits:
          cpus: "${G1_CPU:-1.0}"
          memory: "${G1_MEM:-8G}"
    networks:
      - sandbox_net

  ghost2:
    build:
      context: .
      dockerfile: "${GHOST_DOCKERFILE:-Dockerfile}"
      args:
        HOST_UID: "${HOST_UID:-1000}"
        HOST_GID: "${HOST_GID:-1000}"
        GHOST_USER: "${GHOST_USER:-developer}"
    image: "${GHOST_IMAGE:-ubuntu-template:latest}"
    container_name: "${G2_NAME:-ghost-machine2}"
    restart: unless-stopped
    entrypoint: ["/entrypoint.sh"]
    command: ["/usr/sbin/sshd", "-D"]
    environment:
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
      - GHOST_USER=${GHOST_USER:-developer}
      - SSH_PASSWORD_AUTH=${SSH_PASSWORD_AUTH:-true}
    ports:
      - "${G2_PORT:-2224}:22"
    volumes:
      - ${LXCFS_CPUINFO:-/dev/null}:/proc/cpuinfo:ro
      - ${LXCFS_MEMINFO:-/dev/null}:/proc/meminfo:ro
      - ${LXCFS_STAT:-/dev/null}:/proc/stat:ro
      - ${LXCFS_SWAPS:-/dev/null}:/proc/swaps:ro
      - ${LXCFS_UPTIME:-/dev/null}:/proc/uptime:ro
      - ./mounts/ubuntu2:/home/${GHOST_USER:-developer}
      - ./entrypoint.sh:/entrypoint.sh:ro
      - ${SSH_AUTH_KEY_PATH:-/dev/null}:/root/.ssh/authorized_keys:ro
      - ${MCP_ECOSYSTEM_LOCAL_PATH:-/dev/null}:/opt/mcp-ecosystem-local:ro
      - ${HOST_AGY_BIN:-/dev/null}:/usr/local/bin/agy:ro
    deploy:
      resources:
        limits:
          cpus: "${G2_CPU:-1.0}"
          memory: "${G2_MEM:-8G}"
    networks:
      - sandbox_net
    profiles:
      - dual

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: ghost-tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    profiles:
      - remote
    networks:
      - sandbox_net

networks:
  sandbox_net:
    name: ghost_sandbox
    driver: bridge
