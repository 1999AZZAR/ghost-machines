<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <!-- Pure white background -->
  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- Ground line -->
  <line x1="260" y1="680" x2="1340" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>

  <!-- LEFT: Log Terminal / Station -->
  <rect x="310" y="550" width="110" height="130" rx="4" fill="#ffffff" stroke="#000000" stroke-width="6" stroke-linejoin="round"/>
  <!-- Console log screen scan lines -->
  <line x1="330" y1="580" x2="390" y2="580" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <line x1="330" y1="605" x2="400" y2="605" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <line x1="330" y1="630" x2="370" y2="630" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <line x1="330" y1="655" x2="395" y2="655" stroke="#000000" stroke-width="4" stroke-linecap="round"/>

  <!-- TRAIL OF PAW FOOTPRINTS LEADING RIGHT -->
  <g fill="#000000">
    <!-- Print 1 -->
    <ellipse cx="460" cy="670" rx="6" ry="4"/>
    <circle cx="454" cy="662" r="2"/>
    <circle cx="460" cy="660" r="2"/>
    <circle cx="466" cy="662" r="2"/>
    <!-- Print 2 -->
    <ellipse cx="530" cy="670" rx="6" ry="4"/>
    <circle cx="524" cy="662" r="2"/>
    <circle cx="530" cy="660" r="2"/>
    <circle cx="536" cy="662" r="2"/>
    <!-- Print 3 -->
    <ellipse cx="600" cy="670" rx="6" ry="4"/>
    <circle cx="594" cy="662" r="2"/>
    <circle cx="600" cy="660" r="2"/>
    <circle cx="606" cy="662" r="2"/>
    <!-- Print 4 -->
    <ellipse cx="860" cy="670" rx="6" ry="4"/>
    <circle cx="854" cy="662" r="2"/>
    <circle cx="860" cy="660" r="2"/>
    <circle cx="866" cy="662" r="2"/>
    <!-- Print 5 -->
    <ellipse cx="940" cy="670" rx="6" ry="4"/>
    <circle cx="934" cy="662" r="2"/>
    <circle cx="940" cy="660" r="2"/>
    <circle cx="946" cy="662" r="2"/>
  </g>

  <!-- BLOTCAT (Holding magnifying glass, investigating trail) -->
  <!-- Tail -->
  <path d="M 640 595 C 610 605 595 565 605 530" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <!-- Thin stick legs -->
  <line x1="660" y1="620" x2="655" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <line x1="690" y1="620" x2="695" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <line x1="645" y1="680" x2="660" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <line x1="695" y1="680" x2="710" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <!-- Solid black body leaning forward -->
  <path d="M 640 540 C 630 480 665 445 695 445 C 725 445 740 480 735 540 C 730 590 720 625 685 625 C 655 625 645 590 640 540 Z" fill="#000000"/>
  <!-- Ears -->
  <polygon points="660,455 650,425 675,447" fill="#000000"/>
  <polygon points="700,447 720,425 720,455" fill="#000000"/>
  <!-- White dot eyes focused down towards magnifier -->
  <circle cx="695" cy="475" r="5" fill="#ffffff"/>
  <circle cx="713" cy="476" r="5" fill="#ffffff"/>

  <!-- Stick arms holding magnifying glass -->
  <path d="M 720 530 L 760 540 L 780 575" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <!-- Magnifier rim and lens -->
  <circle cx="795" cy="600" r="32" fill="#ffffff" stroke="#000000" stroke-width="6"/>
  <line x1="775" y1="575" x2="755" y2="550" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <!-- Glare tick inside lens -->
  <path d="M 780 585 A 18 18 0 0 1 805 585" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"/>

  <!-- RIGHT: THE CUT CABLE WITH SPARKING ENDS -->
  <!-- Left severed segment -->
  <path d="M 970 670 Q 1010 670 1025 650" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <!-- Sparks on left cut -->
  <line x1="1025" y1="650" x2="1015" y2="635" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
  <line x1="1025" y1="650" x2="1035" y2="635" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>

  <!-- Clean break gap (1025 to 1065) -->

  <!-- Right severed segment running off to destination -->
  <path d="M 1065 645 Q 1090 670 1260 670" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <!-- Sparks on right cut -->
  <line x1="1065" y1="645" x2="1055" y2="630" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
  <line x1="1065" y1="645" x2="1075" y2="630" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
  <!-- Disconnected plug end -->
  <rect x="1230" y="660" width="30" height="20" rx="3" fill="#ffffff" stroke="#000000" stroke-width="5"/>

  <!-- LABELS (Completely clear of any lines/strokes) -->
  <!-- Blue: logs (well above the log terminal) -->
  <text x="365" y="490" fill="#2563eb" font-family="JetBrains Mono, monospace" font-size="28" font-weight="600" text-anchor="middle">logs</text>
  <!-- Orange: status (cleanly floating in upper air) -->
  <text x="700" y="380" fill="#ea580c" font-family="JetBrains Mono, monospace" font-size="28" font-weight="600" text-anchor="middle">status</text>
  <!-- Red: refused (well above the cut cable) -->
  <text x="1045" y="570" fill="#dc2626" font-family="JetBrains Mono, monospace" font-size="28" font-weight="600" text-anchor="middle">refused</text>
</svg>
