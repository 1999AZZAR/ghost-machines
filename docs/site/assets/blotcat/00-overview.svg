<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <!-- Pure white background -->
  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- Minimal ground line -->
  <line x1="260" y1="680" x2="1340" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>

  <!-- LEFT: Disposable Wooden Crate -->
  <!-- Crate body -->
  <rect x="340" y="520" width="190" height="160" fill="#ffffff" stroke="#000000" stroke-width="6" stroke-linejoin="round"/>
  <!-- Crate slats & cross braces -->
  <line x1="340" y1="573" x2="530" y2="573" stroke="#000000" stroke-width="4"/>
  <line x1="340" y1="626" x2="530" y2="626" stroke="#000000" stroke-width="4"/>
  <line x1="340" y1="520" x2="530" y2="680" stroke="#000000" stroke-width="4"/>
  <line x1="340" y1="680" x2="530" y2="520" stroke="#000000" stroke-width="4"/>
  <!-- Laptop sliding into crate -->
  <path d="M 410 460 L 490 495 L 450 560 L 370 525 Z" fill="#ffffff" stroke="#000000" stroke-width="6" stroke-linejoin="round"/>
  <line x1="410" y1="460" x2="480" y2="440" stroke="#000000" stroke-width="5" stroke-linecap="round"/>

  <!-- BLOTCAT (Packing laptop into crate) -->
  <!-- Tail -->
  <path d="M 680 590 C 710 600 725 560 710 525" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <!-- Thin stick legs -->
  <line x1="630" y1="620" x2="625" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <line x1="655" y1="620" x2="660" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <line x1="615" y1="680" x2="625" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <line x1="660" y1="680" x2="670" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <!-- Solid black body -->
  <path d="M 610 540 C 600 480 635 445 665 445 C 695 445 710 480 705 540 C 700 590 690 625 655 625 C 625 625 615 590 610 540 Z" fill="#000000"/>
  <!-- Ears -->
  <polygon points="630,455 620,425 645,447" fill="#000000"/>
  <polygon points="670,447 690,425 690,455" fill="#000000"/>
  <!-- White dot eyes looking left at laptop -->
  <circle cx="635" cy="475" r="5" fill="#ffffff"/>
  <circle cx="653" cy="476" r="5" fill="#ffffff"/>
  <!-- Stick arms pushing laptop down into crate -->
  <path d="M 625 530 L 550 525 L 480 520" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 630 545 L 560 545 L 495 540" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- RIGHT: Persistent Metal Shelf Unit -->
  <!-- Shelf uprights -->
  <line x1="880" y1="360" x2="880" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <line x1="1200" y1="360" x2="1200" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <!-- Cross brace behind -->
  <line x1="880" y1="380" x2="1200" y2="520" stroke="#000000" stroke-width="3" stroke-dasharray="8 8"/>
  <line x1="880" y1="520" x2="1200" y2="380" stroke="#000000" stroke-width="3" stroke-dasharray="8 8"/>
  <!-- Top shelf bar -->
  <line x1="860" y1="460" x2="1220" y2="460" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <!-- Bottom shelf bar -->
  <line x1="860" y1="590" x2="1220" y2="590" stroke="#000000" stroke-width="6" stroke-linecap="round"/>

  <!-- Top Shelf: mounts/ Storage Box -->
  <rect x="940" y="380" width="200" height="80" rx="4" fill="#ffffff" stroke="#000000" stroke-width="6" stroke-linejoin="round"/>
  <!-- Box lid rim & clasp -->
  <line x1="930" y1="395" x2="1150" y2="395" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <rect x="1025" y="415" width="30" height="20" rx="2" fill="#ffffff" stroke="#000000" stroke-width="4"/>

  <!-- Bottom Shelf: 4 Modular Engines (blocks with small ports) -->
  <g stroke="#000000" stroke-width="5" fill="#ffffff">
    <rect x="900" y="525" width="55" height="65" rx="3"/>
    <circle cx="927" cy="557" r="10"/>
    <rect x="975" y="525" width="55" height="65" rx="3"/>
    <circle cx="1002" cy="557" r="10"/>
    <rect x="1050" y="525" width="55" height="65" rx="3"/>
    <circle cx="1077" cy="557" r="10"/>
    <rect x="1125" y="525" width="55" height="65" rx="3"/>
    <circle cx="1152" cy="557" r="10"/>
  </g>

  <!-- ANNOTATIONS -->
  <!-- Red: throwaway -->
  <text x="435" y="730" fill="#dc2626" font-family="JetBrains Mono, monospace" font-size="28" font-weight="600" text-anchor="middle">throwaway</text>
  <!-- Blue: mounts/ -->
  <text x="1040" y="340" fill="#2563eb" font-family="JetBrains Mono, monospace" font-size="28" font-weight="600" text-anchor="middle">mounts/</text>
  <!-- Orange: 4 engines -->
  <text x="1040" y="730" fill="#ea580c" font-family="JetBrains Mono, monospace" font-size="28" font-weight="600" text-anchor="middle">4 engines</text>
</svg>
