<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <!-- Pure white background -->
  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- Ground line -->
  <line x1="200" y1="680" x2="1400" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>

  <!-- LEFT: BLOTCAT WEARING ONE CHASSIS/BODY (One toolchain) -->
  <!-- Exoskeleton / toolchain chassis harness around Blotcat -->
  <rect x="360" y="525" width="130" height="100" rx="15" fill="#ffffff" stroke="#000000" stroke-width="6"/>
  <!-- Toolchain core indicator / dial -->
  <circle cx="425" cy="575" r="22" fill="#ffffff" stroke="#000000" stroke-width="5"/>
  <circle cx="425" cy="575" r="6" fill="#000000"/>
  <!-- Mechanical arm holding a wrench -->
  <path d="M 480 550 L 525 530 L 540 500" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <!-- Wrench head -->
  <path d="M 533 502 C 533 490 550 490 550 502" fill="none" stroke="#000000" stroke-width="5"/>

  <!-- Blotcat head inside harness -->
  <!-- Solid black head / upper body -->
  <path d="M 390 525 C 380 465 410 435 440 435 C 470 435 485 465 480 525 Z" fill="#000000"/>
  <!-- Pointed cat ears -->
  <polygon points="405,445 395,415 420,437" fill="#000000"/>
  <polygon points="445,437 465,415 465,445" fill="#000000"/>
  <!-- White dot eyes -->
  <circle cx="440" cy="465" r="5" fill="#ffffff"/>
  <circle cx="458" cy="467" r="5" fill="#ffffff"/>

  <!-- Chassis legs down to ground -->
  <line x1="390" y1="625" x2="385" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <line x1="460" y1="625" x2="465" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <line x1="375" y1="680" x2="395" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <line x1="455" y1="680" x2="475" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>

  <!-- Tail curling out of chassis back -->
  <path d="M 360 580 C 330 585 315 545 325 515" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>

  <!-- RIGHT: RACK WITH FOUR MODULAR SHELLS (Ubuntu, Debian, Alpine, Arch) -->
  <!-- Wardrobe / Rack top rail and uprights -->
  <line x1="680" y1="360" x2="1360" y2="360" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <line x1="700" y1="360" x2="700" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <line x1="1340" y1="360" x2="1340" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>

  <!-- SHELL 1: Ubuntu -->
  <!-- Hanger -->
  <line x1="780" y1="360" x2="780" y2="400" stroke="#000000" stroke-width="4"/>
  <!-- Suit shell silhouette -->
  <rect x="735" y="400" width="90" height="170" rx="20" fill="#ffffff" stroke="#000000" stroke-width="6"/>
  <!-- Distro motif accent -->
  <circle cx="780" cy="460" r="14" fill="none" stroke="#000000" stroke-width="4"/>
  <!-- Shell Label -->
  <text x="780" y="620" fill="#000000" font-family="JetBrains Mono, monospace" font-size="22" font-weight="600" text-anchor="middle">ubuntu</text>

  <!-- SHELL 2: Debian -->
  <!-- Hanger -->
  <line x1="930" y1="360" x2="930" y2="400" stroke="#000000" stroke-width="4"/>
  <!-- Suit shell silhouette -->
  <rect x="885" y="400" width="90" height="170" rx="12" fill="#ffffff" stroke="#000000" stroke-width="6"/>
  <!-- Swirl motif -->
  <path d="M 930 450 C 945 450 945 470 930 470 C 922 470 922 460 928 460" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Shell Label -->
  <text x="930" y="620" fill="#000000" font-family="JetBrains Mono, monospace" font-size="22" font-weight="600" text-anchor="middle">debian</text>

  <!-- SHELL 3: Alpine -->
  <!-- Hanger -->
  <line x1="1080" y1="360" x2="1080" y2="400" stroke="#000000" stroke-width="4"/>
  <!-- Lightweight angular shell -->
  <path d="M 1045 420 L 1080 400 L 1115 420 L 1120 570 L 1040 570 Z" fill="#ffffff" stroke="#000000" stroke-width="6" stroke-linejoin="round"/>
  <!-- Mountain motif -->
  <polygon points="1080,445 1065,470 1095,470" fill="none" stroke="#000000" stroke-width="4" stroke-linejoin="round"/>
  <!-- Shell Label -->
  <text x="1080" y="620" fill="#000000" font-family="JetBrains Mono, monospace" font-size="22" font-weight="600" text-anchor="middle">alpine</text>

  <!-- SHELL 4: Arch -->
  <!-- Hanger -->
  <line x1="1230" y1="360" x2="1230" y2="400" stroke="#000000" stroke-width="4"/>
  <!-- Sharp visor shell -->
  <polygon points="1230,400 1275,570 1185,570" fill="#ffffff" stroke="#000000" stroke-width="6" stroke-linejoin="round"/>
  <!-- Arch curve -->
  <path d="M 1215 540 Q 1230 495 1245 540" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Shell Label -->
  <text x="1230" y="620" fill="#000000" font-family="JetBrains Mono, monospace" font-size="22" font-weight="600" text-anchor="middle">arch</text>

  <!-- ANNOTATIONS -->
  <!-- Blue: OS (above rack) -->
  <text x="1010" y="315" fill="#2563eb" font-family="JetBrains Mono, monospace" font-size="28" font-weight="600" text-anchor="middle">OS</text>
  <!-- Orange: one toolchain (below Blotcat) -->
  <text x="430" y="730" fill="#ea580c" font-family="JetBrains Mono, monospace" font-size="28" font-weight="600" text-anchor="middle">one toolchain</text>
</svg>
