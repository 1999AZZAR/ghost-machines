<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <!-- Pure white background -->
  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- Ground line -->
  <line x1="280" y1="680" x2="1320" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>

  <!-- CENTER: Freestanding Wall and Door Section -->
  <line x1="770" y1="280" x2="770" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <line x1="870" y1="280" x2="870" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <line x1="770" y1="280" x2="870" y2="280" stroke="#000000" stroke-width="6"/>

  <!-- Brick texture accents on wall -->
  <line x1="770" y1="340" x2="870" y2="340" stroke="#000000" stroke-width="3"/>
  <line x1="820" y1="280" x2="820" y2="340" stroke="#000000" stroke-width="3"/>
  <line x1="770" y1="400" x2="870" y2="400" stroke="#000000" stroke-width="3"/>
  <line x1="795" y1="340" x2="795" y2="400" stroke="#000000" stroke-width="3"/>
  <line x1="845" y1="340" x2="845" y2="400" stroke="#000000" stroke-width="3"/>

  <!-- Small Embedded Doorway -->
  <rect x="785" y="460" width="70" height="220" fill="#ffffff" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Door knob -->
  <circle cx="797" cy="570" r="4" fill="#000000"/>
  <!-- Mail slot / pass-through hatch -->
  <rect x="795" y="525" width="50" height="26" rx="2" fill="#ffffff" stroke="#000000" stroke-width="4"/>

  <!-- BLOTCAT (Left side, handing key through hatch) -->
  <!-- Tail -->
  <path d="M 500 595 C 470 605 460 565 470 530" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <!-- Thin stick legs -->
  <line x1="520" y1="620" x2="515" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <line x1="545" y1="620" x2="550" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <line x1="510" y1="680" x2="520" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <line x1="550" y1="680" x2="560" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <!-- Solid black body -->
  <path d="M 500 540 C 490 480 525 445 555 445 C 585 445 600 480 595 540 C 590 590 580 625 545 625 C 515 625 505 590 500 540 Z" fill="#000000"/>
  <!-- Ears -->
  <polygon points="520,455 510,425 535,447" fill="#000000"/>
  <polygon points="560,447 580,425 580,455" fill="#000000"/>
  <!-- White dot eyes looking right at the door -->
  <circle cx="555" cy="475" r="5" fill="#ffffff"/>
  <circle cx="573" cy="476" r="5" fill="#ffffff"/>

  <!-- Arm holding and threading key through hatch -->
  <path d="M 580 535 L 670 538 L 795 538" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <!-- The Key (bow in paw, shaft through slot, bit on inside) -->
  <circle cx="680" cy="538" r="14" fill="none" stroke="#000000" stroke-width="5"/>
  <line x1="694" y1="538" x2="825" y2="538" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <line x1="815" y1="538" x2="815" y2="548" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <line x1="823" y1="538" x2="823" y2="550" stroke="#000000" stroke-width="5" stroke-linecap="round"/>

  <!-- Inside paw receiving key on other side -->
  <path d="M 870 545 L 835 542" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round"/>

  <!-- RIGHT: Stopwatch / Timer on small stool -->
  <!-- Stool -->
  <line x1="1040" y1="590" x2="1140" y2="590" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <line x1="1055" y1="590" x2="1050" y2="680" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <line x1="1125" y1="590" x2="1130" y2="680" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <!-- Egg Timer / Clock -->
  <circle cx="1090" cy="535" r="45" fill="#ffffff" stroke="#000000" stroke-width="6"/>
  <!-- Top button -->
  <rect x="1082" y="478" width="16" height="12" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <!-- Dial ticks & hands pointing to 5 min mark -->
  <line x1="1090" y1="498" x2="1090" y2="506" stroke="#000000" stroke-width="3"/>
  <line x1="1127" y1="535" x2="1119" y2="535" stroke="#000000" stroke-width="3"/>
  <line x1="1090" y1="535" x2="1118" y2="515" stroke="#000000" stroke-width="5" stroke-linecap="round"/>

  <!-- ANNOTATIONS -->
  <!-- Blue: ssh -->
  <text x="710" y="505" fill="#2563eb" font-family="JetBrains Mono, monospace" font-size="28" font-weight="600" text-anchor="middle">ssh</text>
  <!-- Black/Blue: 2223 -->
  <text x="820" y="440" fill="#2563eb" font-family="JetBrains Mono, monospace" font-size="28" font-weight="600" text-anchor="middle">2223</text>
  <!-- Orange: 5 min -->
  <text x="1090" y="450" fill="#ea580c" font-family="JetBrains Mono, monospace" font-size="28" font-weight="600" text-anchor="middle">5 min</text>
</svg>
