<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <!-- Pure white background -->
  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- Minimal ground line -->
  <line x1="280" y1="680" x2="1320" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>

  <!-- BALANCE SCALE FULCRUM (Center X=800) -->
  <line x1="720" y1="680" x2="880" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <polygon points="800,470 760,680 840,680" fill="none" stroke="#000000" stroke-width="6" stroke-linejoin="round"/>
  <circle cx="800" cy="470" r="10" fill="#000000"/>

  <!-- TILTED BEAM (Left pan high/light, Right pan low/heavy - tilt ~12 deg) -->
  <line x1="480" y1="410" x2="1120" y2="540" stroke="#000000" stroke-width="6" stroke-linecap="round"/>

  <!-- LEFT PAN (Light box, lifted high up) -->
  <line x1="490" y1="412" x2="430" y2="500" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <line x1="490" y1="412" x2="550" y2="500" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <path d="M 420 500 Q 490 520 560 500" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <!-- Featherlight small box -->
  <rect x="445" y="425" width="90" height="72" rx="3" fill="#ffffff" stroke="#000000" stroke-width="5"/>
  <line x1="490" y1="425" x2="490" y2="497" stroke="#000000" stroke-width="3"/>

  <!-- RIGHT PAN (Heavy crate, dropped low) -->
  <line x1="1110" y1="538" x2="1050" y2="630" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <line x1="1110" y1="538" x2="1170" y2="630" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <path d="M 1040 630 Q 1110 650 1180 630" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <!-- Heavy iron-bound crate on pan -->
  <rect x="1060" y="540" width="100" height="88" rx="2" fill="#ffffff" stroke="#000000" stroke-width="6" stroke-linejoin="round"/>
  <line x1="1060" y1="540" x2="1160" y2="628" stroke="#000000" stroke-width="4"/>
  <line x1="1060" y1="628" x2="1160" y2="540" stroke="#000000" stroke-width="4"/>

  <!-- BLOTCAT (Observing and balancing on the scale, deadpan) -->
  <!-- Tail -->
  <path d="M 640 595 C 610 605 595 565 605 530" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <!-- Thin stick legs planted beside pivot stand -->
  <line x1="660" y1="620" x2="655" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <line x1="690" y1="620" x2="695" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <line x1="645" y1="680" x2="660" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <line x1="695" y1="680" x2="710" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <!-- Solid black body -->
  <path d="M 640 540 C 630 480 665 445 695 445 C 725 445 740 480 735 540 C 730 590 720 625 685 625 C 655 625 645 590 640 540 Z" fill="#000000"/>
  <!-- Ears -->
  <polygon points="660,455 650,425 675,447" fill="#000000"/>
  <polygon points="700,447 720,425 720,455" fill="#000000"/>
  <!-- White dot eyes -->
  <circle cx="695" cy="475" r="5" fill="#ffffff"/>
  <circle cx="713" cy="476" r="5" fill="#ffffff"/>

  <!-- Paws resting thoughtfully on the beam -->
  <path d="M 715 530 L 760 500 L 780 475" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>

  <!-- LABELS (Completely clear of strokes) -->
  <!-- Blue: seconds (below light box pan) -->
  <text x="490" y="575" fill="#2563eb" font-family="JetBrains Mono, monospace" font-size="28" font-weight="600" text-anchor="middle">seconds</text>
  <!-- Red: minutes (below heavy crate pan) -->
  <text x="1110" y="730" fill="#dc2626" font-family="JetBrains Mono, monospace" font-size="28" font-weight="600" text-anchor="middle">minutes</text>
  <!-- Orange: shared kernel (above the central scale fulcrum) -->
  <text x="800" y="310" fill="#ea580c" font-family="JetBrains Mono, monospace" font-size="28" font-weight="600" text-anchor="middle">shared kernel</text>
</svg>
