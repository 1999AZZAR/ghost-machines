<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <!-- Pure white background -->
  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- Minimal ground line -->
  <line x1="240" y1="680" x2="1360" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>

  <!-- THREE MODULAR PIPES ASSEMBLED END TO END (Y center = 530) -->

  <!-- PIPE 1: compose (X=460 to 660) -->
  <rect x="475" y="490" width="170" height="80" rx="2" fill="#ffffff" stroke="#000000" stroke-width="6"/>
  <!-- Pipe Flange Left -->
  <rect x="460" y="475" width="20" height="110" rx="3" fill="#ffffff" stroke="#000000" stroke-width="6"/>
  <!-- Pipe Flange Right -->
  <rect x="640" y="475" width="20" height="110" rx="3" fill="#ffffff" stroke="#000000" stroke-width="6"/>
  <!-- Pipe stand 1 -->
  <line x1="560" y1="570" x2="560" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <line x1="540" y1="680" x2="580" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>

  <!-- Pipe Joint Connection 1-2 (coupling ring) -->
  <line x1="660" y1="530" x2="685" y2="530" stroke="#ea580c" stroke-width="5" stroke-linecap="round"/>

  <!-- PIPE 2: entrypoint (X=685 to 885) -->
  <rect x="700" y="490" width="170" height="80" rx="2" fill="#ffffff" stroke="#000000" stroke-width="6"/>
  <!-- Pipe Flange Left -->
  <rect x="685" y="475" width="20" height="110" rx="3" fill="#ffffff" stroke="#000000" stroke-width="6"/>
  <!-- Pipe Flange Right -->
  <rect x="865" y="475" width="20" height="110" rx="3" fill="#ffffff" stroke="#000000" stroke-width="6"/>
  <!-- Pipe stand 2 -->
  <line x1="785" y1="570" x2="785" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <line x1="765" y1="680" x2="805" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>

  <!-- Pipe Joint Connection 2-3 (coupling ring) -->
  <line x1="885" y1="530" x2="910" y2="530" stroke="#ea580c" stroke-width="5" stroke-linecap="round"/>

  <!-- PIPE 3: sshd (X=910 to 1110) -->
  <rect x="925" y="490" width="170" height="80" rx="2" fill="#ffffff" stroke="#000000" stroke-width="6"/>
  <!-- Pipe Flange Left -->
  <rect x="910" y="475" width="20" height="110" rx="3" fill="#ffffff" stroke="#000000" stroke-width="6"/>
  <!-- Pipe Flange Right / Exhaust nozzle -->
  <rect x="1090" y="475" width="20" height="110" rx="3" fill="#ffffff" stroke="#000000" stroke-width="6"/>
  <!-- Pipe stand 3 -->
  <line x1="1010" y1="570" x2="1010" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <line x1="990" y1="680" x2="1030" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>

  <!-- Flow Direction Arrow through pipes -->
  <path d="M 520 530 L 610 530" fill="none" stroke="#ea580c" stroke-width="4" stroke-dasharray="8 6"/>
  <path d="M 740 530 L 830 530" fill="none" stroke="#ea580c" stroke-width="4" stroke-dasharray="8 6"/>
  <path d="M 970 530 L 1050 530" fill="none" stroke="#ea580c" stroke-width="4" stroke-dasharray="8 6"/>

  <!-- BLOTCAT (Assembling pipe 1 with giant wrench) -->
  <!-- Tail -->
  <path d="M 320 595 C 290 605 280 565 290 530" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <!-- Thin stick legs -->
  <line x1="340" y1="620" x2="335" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <line x1="370" y1="620" x2="375" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <line x1="325" y1="680" x2="340" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <line x1="370" y1="680" x2="385" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <!-- Solid black body -->
  <path d="M 320 540 C 310 480 345 445 375 445 C 405 445 420 480 415 540 C 410 590 400 625 365 625 C 335 625 325 590 320 540 Z" fill="#000000"/>
  <!-- Ears -->
  <polygon points="340,455 330,425 355,447" fill="#000000"/>
  <polygon points="380,447 400,425 400,455" fill="#000000"/>
  <!-- White dot eyes -->
  <circle cx="375" cy="475" r="5" fill="#ffffff"/>
  <circle cx="393" cy="476" r="5" fill="#ffffff"/>

  <!-- Stick arms holding wrench to pipe flange -->
  <path d="M 395 530 L 440 510 L 460 485" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <path d="M 390 545 L 435 530 L 460 505" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <!-- Wrench tool -->
  <path d="M 465 470 L 450 495 L 430 460" fill="none" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- LABELS (Completely clear of strokes) -->
  <!-- Blue: compose (well above Pipe 1) -->
  <text x="560" y="415" fill="#2563eb" font-family="JetBrains Mono, monospace" font-size="28" font-weight="600" text-anchor="middle">compose</text>
  <!-- Orange: entrypoint (well above Pipe 2) -->
  <text x="785" y="415" fill="#ea580c" font-family="JetBrains Mono, monospace" font-size="28" font-weight="600" text-anchor="middle">entrypoint</text>
  <!-- Blue: sshd (well above Pipe 3) -->
  <text x="1010" y="415" fill="#2563eb" font-family="JetBrains Mono, monospace" font-size="28" font-weight="600" text-anchor="middle">sshd</text>
</svg>
