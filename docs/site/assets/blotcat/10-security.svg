<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <!-- Pure white background -->
  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- Minimal ground line -->
  <line x1="240" y1="680" x2="1360" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>

  <!-- HEAVY SECURITY DOOR (X=660 to 810) -->
  <rect x="660" y="360" width="150" height="320" rx="4" fill="#ffffff" stroke="#000000" stroke-width="6" stroke-linejoin="round"/>
  <!-- Door panels -->
  <rect x="680" y="380" width="110" height="120" rx="2" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <rect x="680" y="530" width="110" height="130" rx="2" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <!-- Heavy steel hasp -->
  <rect x="640" y="515" width="45" height="18" rx="2" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <!-- Heavy padlock -->
  <rect x="645" y="533" width="36" height="38" rx="4" fill="#ffffff" stroke="#000000" stroke-width="5"/>
  <path d="M 653 533 L 653 520 C 653 510 673 510 673 520 L 673 533" fill="none" stroke="#000000" stroke-width="5"/>
  <circle cx="663" cy="552" r="3" fill="#000000"/>

  <!-- BLOTCAT (Locking pad and scratching out sign simultaneously) -->
  <!-- Tail -->
  <path d="M 480 595 C 450 605 440 565 450 530" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <!-- Thin stick legs -->
  <line x1="500" y1="620" x2="495" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <line x1="530" y1="620" x2="535" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <line x1="485" y1="680" x2="500" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <line x1="535" y1="680" x2="550" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <!-- Solid black body -->
  <path d="M 480 540 C 470 480 505 445 535 445 C 565 445 580 480 575 540 C 570 590 560 625 525 625 C 495 625 485 590 480 540 Z" fill="#000000"/>
  <!-- Ears -->
  <polygon points="500,455 490,425 515,447" fill="#000000"/>
  <polygon points="540,447 560,425 560,455" fill="#000000"/>
  <!-- White dot eyes -->
  <circle cx="535" cy="475" r="5" fill="#ffffff"/>
  <circle cx="553" cy="476" r="5" fill="#ffffff"/>

  <!-- Left stick arm locking the padlock -->
  <path d="M 555 530 L 610 540 L 645 545" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>

  <!-- Right stick arm reaching over to scratch the sign -->
  <path d="M 560 515 L 670 470 L 890 440" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>

  <!-- WARNING SIGNPOST ON RIGHT (X=880 to 1080) -->
  <rect x="890" y="380" width="180" height="110" rx="4" fill="#ffffff" stroke="#000000" stroke-width="6" stroke-linejoin="round"/>
  <!-- Signpost pole -->
  <line x1="980" y1="490" x2="980" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <!-- Text inside sign being scratched out -->
  <text x="980" y="445" fill="#000000" font-family="JetBrains Mono, monospace" font-size="28" font-weight="600" text-anchor="middle">ghost</text>
  <!-- Vigorous black scratch-out lines across "ghost" -->
  <line x1="920" y1="420" x2="1040" y2="455" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <line x1="920" y1="455" x2="1040" y2="420" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <line x1="915" y1="438" x2="1045" y2="438" stroke="#000000" stroke-width="5" stroke-linecap="round"/>

  <!-- LABELS (Completely clear of strokes) -->
  <!-- Blue: key only (well above door/padlock) -->
  <text x="630" y="300" fill="#2563eb" font-family="JetBrains Mono, monospace" font-size="28" font-weight="600" text-anchor="middle">key only</text>
  <!-- Red: no root (well above the scratched sign) -->
  <text x="980" y="300" fill="#dc2626" font-family="JetBrains Mono, monospace" font-size="28" font-weight="600" text-anchor="middle">no root</text>
  <!-- Orange: expose? (cleanly to the right of the sign) -->
  <text x="1200" y="440" fill="#ea580c" font-family="JetBrains Mono, monospace" font-size="28" font-weight="600" text-anchor="middle">expose?</text>
</svg>
