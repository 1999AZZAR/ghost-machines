<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <!-- Pure white background -->
  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- Ground line -->
  <line x1="260" y1="680" x2="1340" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>

  <!-- MACHINE WITH DRAWERS & LEVERS (X=750 to 1240) -->
  <rect x="760" y="440" width="460" height="240" rx="4" fill="#ffffff" stroke="#000000" stroke-width="6" stroke-linejoin="round"/>
  <!-- Top console lip -->
  <line x1="740" y1="460" x2="1240" y2="460" stroke="#000000" stroke-width="5" stroke-linecap="round"/>

  <!-- Drawer 1 (upper) -->
  <rect x="790" y="480" width="400" height="80" rx="3" fill="#ffffff" stroke="#000000" stroke-width="5"/>
  <rect x="960" y="510" width="60" height="18" rx="3" fill="#ffffff" stroke="#000000" stroke-width="4"/>

  <!-- Drawer 2 (lower - partially slid out) -->
  <rect x="780" y="580" width="420" height="80" rx="3" fill="#ffffff" stroke="#000000" stroke-width="5"/>
  <rect x="960" y="610" width="60" height="18" rx="3" fill="#ffffff" stroke="#000000" stroke-width="4"/>

  <!-- LEVER 1 (start): pulled forward/angled left -->
  <rect x="815" y="420" width="40" height="20" rx="2" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <line x1="835" y1="420" x2="795" y2="350" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <circle cx="790" cy="340" r="14" fill="#000000"/>

  <!-- LEVER 2 (snapshot): standing upright -->
  <rect x="970" y="420" width="40" height="20" rx="2" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <line x1="990" y1="420" x2="990" y2="340" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <circle cx="990" cy="330" r="14" fill="#000000"/>

  <!-- LEVER 3 (clean): pulled back/angled right -->
  <rect x="1125" y="420" width="40" height="20" rx="2" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <line x1="1145" y1="420" x2="1185" y2="350" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <circle cx="1195" cy="340" r="14" fill="#000000"/>

  <!-- BLOTCAT (Pulling levers with deadpan seriousness) -->
  <!-- Tail -->
  <path d="M 500 595 C 470 605 460 565 470 530" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <!-- Thin stick legs -->
  <line x1="520" y1="620" x2="515" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <line x1="550" y1="620" x2="555" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <line x1="505" y1="680" x2="520" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <line x1="555" y1="680" x2="570" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <!-- Solid black body -->
  <path d="M 500 540 C 490 480 525 445 555 445 C 585 445 600 480 595 540 C 590 590 580 625 545 625 C 515 625 505 590 500 540 Z" fill="#000000"/>
  <!-- Ears -->
  <polygon points="520,455 510,425 535,447" fill="#000000"/>
  <polygon points="560,447 580,425 580,455" fill="#000000"/>
  <!-- White dot eyes -->
  <circle cx="555" cy="475" r="5" fill="#ffffff"/>
  <circle cx="573" cy="476" r="5" fill="#ffffff"/>

  <!-- Stick arms extending to Lever 1 and 2 -->
  <path d="M 580 520 L 680 430 L 785 350" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <path d="M 575 535 L 750 440 L 980 345" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>

  <!-- LABELS (Completely clear of strokes) -->
  <!-- Blue: start (above Lever 1 knob) -->
  <text x="760" y="290" fill="#2563eb" font-family="JetBrains Mono, monospace" font-size="28" font-weight="600" text-anchor="middle">start</text>
  <!-- Orange: snapshot (above Lever 2 knob) -->
  <text x="990" y="275" fill="#ea580c" font-family="JetBrains Mono, monospace" font-size="28" font-weight="600" text-anchor="middle">snapshot</text>
  <!-- Red: clean (above Lever 3 knob) -->
  <text x="1220" y="290" fill="#dc2626" font-family="JetBrains Mono, monospace" font-size="28" font-weight="600" text-anchor="middle">clean</text>
</svg>
