<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <!-- Pure white background -->
  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- Minimal ground line -->
  <line x1="280" y1="680" x2="1320" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>

  <!-- CONTROL PANEL / CONSOLE -->
  <!-- Main console angled chassis -->
  <polygon points="760,470 1240,470 1260,680 740,680" fill="#ffffff" stroke="#000000" stroke-width="6" stroke-linejoin="round"/>
  <!-- Console sub-panel divider line -->
  <line x1="750" y1="580" x2="1250" y2="580" stroke="#000000" stroke-width="4"/>

  <!-- DIAL 1: .env -->
  <circle cx="840" cy="525" r="36" fill="#ffffff" stroke="#000000" stroke-width="6"/>
  <circle cx="840" cy="525" r="8" fill="#000000"/>
  <line x1="840" y1="525" x2="820" y2="500" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <!-- Dial tick marks around edge -->
  <line x1="840" y1="480" x2="840" y2="487" stroke="#000000" stroke-width="4"/>
  <line x1="810" y1="495" x2="815" y2="500" stroke="#000000" stroke-width="4"/>
  <line x1="870" y1="495" x2="865" y2="500" stroke="#000000" stroke-width="4"/>

  <!-- DIAL 2: G1_PORT -->
  <circle cx="1000" cy="525" r="36" fill="#ffffff" stroke="#000000" stroke-width="6"/>
  <circle cx="1000" cy="525" r="8" fill="#000000"/>
  <line x1="1000" y1="525" x2="1025" y2="505" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <!-- Dial ticks -->
  <line x1="1000" y1="480" x2="1000" y2="487" stroke="#000000" stroke-width="4"/>
  <line x1="970" y1="495" x2="975" y2="500" stroke="#000000" stroke-width="4"/>
  <line x1="1030" y1="495" x2="1025" y2="500" stroke="#000000" stroke-width="4"/>

  <!-- DIAL 3: rebuild -->
  <circle cx="1160" cy="525" r="36" fill="#ffffff" stroke="#000000" stroke-width="6"/>
  <circle cx="1160" cy="525" r="8" fill="#000000"/>
  <line x1="1160" y1="525" x2="1160" y2="555" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <!-- Dial ticks -->
  <line x1="1160" y1="480" x2="1160" y2="487" stroke="#000000" stroke-width="4"/>
  <line x1="1130" y1="495" x2="1135" y2="500" stroke="#000000" stroke-width="4"/>
  <line x1="1190" y1="495" x2="1185" y2="500" stroke="#000000" stroke-width="4"/>

  <!-- Lower panel indicators & switch slots -->
  <circle cx="840" cy="630" r="12" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <circle cx="1000" cy="630" r="12" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <circle cx="1160" cy="630" r="12" fill="#ffffff" stroke="#000000" stroke-width="4"/>

  <!-- BLOTCAT (Turning dials with deadpan precision) -->
  <!-- Tail -->
  <path d="M 480 595 C 450 605 440 565 450 530" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <!-- Thin stick legs -->
  <line x1="500" y1="620" x2="495" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <line x1="530" y1="620" x2="535" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <line x1="485" y1="680" x2="500" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <line x1="535" y1="680" x2="550" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <!-- Solid black body -->
  <path d="M 480 540 C 470 480 505 445 535 445 C 565 445 580 480 575 540 C 570 590 560 625 525 625 C 495 625 485 590 480 540 Z" fill="#000000"/>
  <!-- Ears -->
  <polygon points="500,455 490,425 515,447" fill="#000000"/>
  <polygon points="540,447 560,425 560,455" fill="#000000"/>
  <!-- White dot eyes looking right at the dials -->
  <circle cx="535" cy="475" r="5" fill="#ffffff"/>
  <circle cx="553" cy="476" r="5" fill="#ffffff"/>

  <!-- Arms reaching out to turn Dial 1 -->
  <path d="M 565 525 L 670 515 L 815 515" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 560 545 L 665 535 L 810 535" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- LABELS (Completely clear of any lines/strokes) -->
  <!-- Blue: .env (well above Dial 1) -->
  <text x="840" y="415" fill="#2563eb" font-family="JetBrains Mono, monospace" font-size="28" font-weight="600" text-anchor="middle">.env</text>
  <!-- Orange: G1_PORT (well above Dial 2) -->
  <text x="1000" y="415" fill="#ea580c" font-family="JetBrains Mono, monospace" font-size="28" font-weight="600" text-anchor="middle">G1_PORT</text>
  <!-- Red: rebuild (well above Dial 3) -->
  <text x="1160" y="415" fill="#dc2626" font-family="JetBrains Mono, monospace" font-size="28" font-weight="600" text-anchor="middle">rebuild</text>
</svg>
