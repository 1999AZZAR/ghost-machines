<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <!-- Pure white background -->
  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- Minimal ground line -->
  <line x1="240" y1="680" x2="1360" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>

  <!-- LEFT: Light Container Box (Featherlight) -->
  <rect x="340" y="550" width="130" height="130" rx="3" fill="#ffffff" stroke="#000000" stroke-width="6" stroke-linejoin="round"/>
  <!-- Light packing tape on container box -->
  <line x1="405" y1="550" x2="405" y2="680" stroke="#000000" stroke-width="4"/>
  <line x1="340" y1="615" x2="470" y2="615" stroke="#000000" stroke-width="4"/>
  <!-- Small lift / feather motif nearby -->
  <path d="M 330 520 Q 370 480 430 510" fill="none" stroke="#2563eb" stroke-width="4" stroke-dasharray="6 6"/>

  <!-- RIGHT: Heavy Reinforced VM Crate (Massive iron brackets, padlocks, double walls) -->
  <rect x="1080" y="470" width="220" height="210" rx="4" fill="#ffffff" stroke="#000000" stroke-width="6" stroke-linejoin="round"/>
  <!-- Iron corner reinforcements and cross braces -->
  <line x1="1080" y1="470" x2="1300" y2="680" stroke="#000000" stroke-width="5"/>
  <line x1="1080" y1="680" x2="1300" y2="470" stroke="#000000" stroke-width="5"/>
  <!-- Rivets on corners -->
  <circle cx="1100" cy="490" r="4" fill="#000000"/>
  <circle cx="1280" cy="490" r="4" fill="#000000"/>
  <circle cx="1100" cy="660" r="4" fill="#000000"/>
  <circle cx="1280" cy="660" r="4" fill="#000000"/>

  <!-- CENTER: BLOTCAT WITH GLOSSARY BOOK ON LECTERN -->
  <!-- Lectern stand -->
  <line x1="770" y1="530" x2="770" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <line x1="730" y1="680" x2="810" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <line x1="720" y1="530" x2="820" y2="530" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <!-- Open Dictionary / Glossary Book -->
  <path d="M 720 525 Q 770 540 820 525 L 825 480 Q 770 495 720 480 Z" fill="#ffffff" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <line x1="770" y1="492" x2="770" y2="537" stroke="#000000" stroke-width="4"/>

  <!-- Blotcat standing behind/beside lectern (X=610 to 690) -->
  <!-- Tail -->
  <path d="M 590 595 C 560 605 550 565 560 530" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <!-- Thin stick legs -->
  <line x1="610" y1="620" x2="605" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <line x1="640" y1="620" x2="645" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <line x1="595" y1="680" x2="610" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <line x1="640" y1="680" x2="655" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <!-- Solid black body -->
  <path d="M 590 540 C 580 480 615 445 645 445 C 675 445 690 480 685 540 C 680 590 670 625 635 625 C 605 625 595 590 590 540 Z" fill="#000000"/>
  <!-- Ears -->
  <polygon points="610,455 600,425 625,447" fill="#000000"/>
  <polygon points="650,447 670,425 670,455" fill="#000000"/>
  <!-- White dot eyes -->
  <circle cx="645" cy="475" r="5" fill="#ffffff"/>
  <circle cx="663" cy="476" r="5" fill="#ffffff"/>

  <!-- Stick paws on book flipping pages -->
  <path d="M 665 525 L 725 510 L 755 505" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <path d="M 660 540 L 730 525 L 780 515" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>

  <!-- Translation arc between light box and heavy crate through kernel -->
  <path d="M 470 510 Q 770 330 1070 450" fill="none" stroke="#ea580c" stroke-width="4" stroke-dasharray="10 8" stroke-linecap="round"/>
  <!-- Arrowheads -->
  <path d="M 485 502 L 470 510 L 480 525" fill="none" stroke="#ea580c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 1055 440 L 1070 450 L 1058 462" fill="none" stroke="#ea580c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- LABELS (Completely clear of strokes) -->
  <!-- Blue: container (above light box) -->
  <text x="405" y="445" fill="#2563eb" font-family="JetBrains Mono, monospace" font-size="28" font-weight="600" text-anchor="middle">container</text>
  <!-- Orange: kernel (above the glossary translation arc) -->
  <text x="770" y="300" fill="#ea580c" font-family="JetBrains Mono, monospace" font-size="28" font-weight="600" text-anchor="middle">kernel</text>
  <!-- Red: vm (above heavy crate) -->
  <text x="1190" y="420" fill="#dc2626" font-family="JetBrains Mono, monospace" font-size="28" font-weight="600" text-anchor="middle">vm</text>
</svg>
