<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <!-- Pure white background -->
  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- Minimal ground line -->
  <line x1="310" y1="680" x2="900" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>

  <!-- Central balance scale fulcrum / stand -->
  <!-- Base stand -->
  <line x1="720" y1="680" x2="880" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <polygon points="800,470 760,680 840,680" fill="none" stroke="#000000" stroke-width="6" stroke-linejoin="round"/>
  <!-- Central pivot pin -->
  <circle cx="800" cy="470" r="10" fill="#000000"/>

  <!-- Tilted balance beam: left pan pushed down (tilt ~11.5 deg) -->
  <line x1="490" y1="535" x2="1110" y2="405" stroke="#000000" stroke-width="6" stroke-linecap="round"/>

  <!-- LEFT PAN (Lower - tilted down) -->
  <!-- Pan chains -->
  <line x1="500" y1="533" x2="440" y2="625" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <line x1="500" y1="533" x2="560" y2="625" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Dish -->
  <path d="M 430 625 Q 500 645 570 625" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>

  <!-- Sealed Parcel on left pan -->
  <rect x="455" y="550" width="90" height="72" rx="3" fill="#ffffff" stroke="#000000" stroke-width="6" stroke-linejoin="round"/>
  <!-- Parcel tape / string -->
  <line x1="500" y1="550" x2="500" y2="622" stroke="#000000" stroke-width="4"/>
  <line x1="455" y1="586" x2="545" y2="586" stroke="#000000" stroke-width="4"/>
  <!-- Parcel top knot -->
  <path d="M 490 542 C 496 550 504 550 510 542" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>

  <!-- RIGHT PAN (Higher - lifted up) -->
  <!-- Pan chains -->
  <line x1="1100" y1="407" x2="1040" y2="500" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <line x1="1100" y1="407" x2="1160" y2="500" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Dish -->
  <path d="M 1030 500 Q 1100 520 1170 500" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>

  <!-- Open Toolbox on right pan -->
  <!-- Box body -->
  <path d="M 1050 445 L 1150 445 L 1145 498 L 1055 498 Z" fill="#ffffff" stroke="#000000" stroke-width="6" stroke-linejoin="round"/>
  <!-- Open lid angled back -->
  <line x1="1150" y1="445" x2="1175" y2="415" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <!-- Center handle -->
  <path d="M 1085 445 L 1085 432 L 1115 432 L 1115 445" fill="none" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  <!-- Tools sticking out -->
  <!-- Wrench shaft & head -->
  <line x1="1068" y1="445" x2="1060" y2="410" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <path d="M 1053 410 C 1053 402 1067 402 1067 410" fill="none" stroke="#000000" stroke-width="5"/>
  <!-- Screwdriver -->
  <line x1="1132" y1="445" x2="1142" y2="415" stroke="#000000" stroke-width="5" stroke-linecap="round"/>

  <!-- BLOTCAT (Solid black blob, white dot eyes, thin legs, pressing parcel pan) -->
  <!-- Tail -->
  <path d="M 345 595 C 315 605 305 565 315 530" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>

  <!-- Thin stick legs -->
  <line x1="365" y1="620" x2="360" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <line x1="390" y1="620" x2="395" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <line x1="355" y1="680" x2="365" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <line x1="395" y1="680" x2="405" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>

  <!-- Solid black body (organic blob) -->
  <path d="M 345 540 C 335 480 370 445 400 445 C 430 445 445 480 440 540 C 435 590 425 625 390 625 C 360 625 350 590 345 540 Z" fill="#000000"/>

  <!-- Pointed cat ears -->
  <polygon points="365,455 355,425 380,447" fill="#000000"/>
  <polygon points="405,447 425,425 425,455" fill="#000000"/>

  <!-- White dot eyes (deadpan blank expression) -->
  <circle cx="400" cy="475" r="5" fill="#ffffff"/>
  <circle cx="418" cy="477" r="5" fill="#ffffff"/>

  <!-- Thin stick arms pressing firmly down on the parcel -->
  <path d="M 425 530 L 460 550 L 475 565" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 420 545 L 455 565 L 470 580" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ANNOTATIONS (Sparse red/orange/blue in JetBrains Mono) -->
  <!-- Left annotation: pull 1 min (Blue) - cleanly below ground line, well clear of any stroke -->
  <text x="500" y="740" fill="#2563eb" font-family="JetBrains Mono, monospace" font-size="28" font-weight="600" text-anchor="middle">pull 1 min</text>

  <!-- Right annotation: build 15 min (Red) -->
  <text x="1100" y="565" fill="#dc2626" font-family="JetBrains Mono, monospace" font-size="28" font-weight="600" text-anchor="middle">build 15 min</text>

  <!-- Center dashed connection curve + annotation: same image (Orange) -->
  <path d="M 545 480 Q 800 330 1055 375" fill="none" stroke="#ea580c" stroke-width="4" stroke-dasharray="10 8" stroke-linecap="round"/>
  <!-- Small arrowheads on arc -->
  <path d="M 558 473 L 545 480 L 552 494" fill="none" stroke="#ea580c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 1045 365 L 1055 375 L 1042 384" fill="none" stroke="#ea580c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="800" y="325" fill="#ea580c" font-family="JetBrains Mono, monospace" font-size="28" font-weight="600" text-anchor="middle">same image</text>
</svg>
