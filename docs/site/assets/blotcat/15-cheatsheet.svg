<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <!-- Pure white background -->
  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- Minimal ground line -->
  <line x1="260" y1="680" x2="1340" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>

  <!-- THE CHEATSHEET POSTER ON THE WALL (X=720 to 1060, Y=330 to 620) -->
  <rect x="730" y="340" width="310" height="270" rx="3" fill="#ffffff" stroke="#000000" stroke-width="6" stroke-linejoin="round"/>

  <!-- Tape strips on corners -->
  <!-- Top-left tape -->
  <polygon points="715,355 750,320 765,335 730,370" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <!-- Top-right tape -->
  <polygon points="1025,320 1060,355 1045,370 1010,335" fill="#ffffff" stroke="#000000" stroke-width="4"/>

  <!-- Cheatsheet command line representations inside paper -->
  <line x1="760" y1="390" x2="980" y2="390" stroke="#000000" stroke-width="5" stroke-linecap="round"/>
  <line x1="760" y1="425" x2="920" y2="425" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <line x1="760" y1="460" x2="960" y2="460" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <line x1="760" y1="495" x2="900" y2="495" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <line x1="760" y1="530" x2="970" y2="530" stroke="#000000" stroke-width="5" stroke-linecap="round"/>

  <!-- Small tools hanging from hooks on bottom of paper -->
  <!-- Hook 1 with key -->
  <path d="M 780 610 L 780 635 A 8 8 0 0 0 796 635" fill="none" stroke="#000000" stroke-width="4"/>
  <circle cx="796" cy="648" r="8" fill="none" stroke="#000000" stroke-width="3"/>
  <line x1="796" y1="656" x2="796" y2="675" stroke="#000000" stroke-width="4"/>

  <!-- Hook 2 with wrench -->
  <path d="M 885 610 L 885 635 A 8 8 0 0 0 901 635" fill="none" stroke="#000000" stroke-width="4"/>
  <line x1="901" y1="638" x2="901" y2="670" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <path d="M 894 670 C 894 678 908 678 908 670" fill="none" stroke="#000000" stroke-width="3"/>

  <!-- Hook 3 with small hammer / tool -->
  <path d="M 990 610 L 990 635 A 8 8 0 0 0 1006 635" fill="none" stroke="#000000" stroke-width="4"/>
  <line x1="1006" y1="638" x2="1006" y2="672" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <rect x="996" y="638" width="20" height="8" rx="2" fill="#ffffff" stroke="#000000" stroke-width="3"/>

  <!-- BLOTCAT TAPING THE SHEET (X=500 to 600) -->
  <!-- Tail -->
  <path d="M 480 595 C 450 605 440 565 450 530" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <!-- Thin stick legs -->
  <line x1="500" y1="620" x2="495" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <line x1="530" y1="620" x2="535" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <line x1="485" y1="680" x2="500" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <line x1="535" y1="680" x2="550" y2="680" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <!-- Solid black body stretched upward -->
  <path d="M 480 540 C 470 470 505 435 535 435 C 565 435 580 470 575 540 C 570 590 560 625 525 625 C 495 625 485 590 480 540 Z" fill="#000000"/>
  <!-- Ears -->
  <polygon points="500,445 490,415 515,437" fill="#000000"/>
  <polygon points="540,437 560,415 560,445" fill="#000000"/>
  <!-- White dot eyes looking up at top tape corner -->
  <circle cx="535" cy="465" r="5" fill="#ffffff"/>
  <circle cx="553" cy="466" r="5" fill="#ffffff"/>

  <!-- Arms reaching high to press top-left tape strip -->
  <path d="M 555 490 L 630 410 L 725 355" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
  <path d="M 550 510 L 640 435 L 730 375" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round"/>

  <!-- LABELS (Completely clear of strokes, right of cheatsheet) -->
  <!-- Blue: start (opposite top line) -->
  <text x="1160" y="395" fill="#2563eb" font-family="JetBrains Mono, monospace" font-size="28" font-weight="600" text-anchor="middle">start</text>
  <!-- Orange: ssh (opposite middle line) -->
  <text x="1160" y="475" fill="#ea580c" font-family="JetBrains Mono, monospace" font-size="28" font-weight="600" text-anchor="middle">ssh</text>
  <!-- Red: nuke (opposite bottom line) -->
  <text x="1160" y="555" fill="#dc2626" font-family="JetBrains Mono, monospace" font-size="28" font-weight="600" text-anchor="middle">nuke</text>
</svg>
