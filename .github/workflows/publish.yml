name: Publish Images to GHCR

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: ubuntu
            dockerfile: Dockerfile
            image: ghcr.io/1999azzar/ghost-machine-ubuntu
            suffix: latest
          - engine: debian
            dockerfile: Dockerfile.debian
            image: ghcr.io/1999azzar/ghost-machine-debian
            suffix: latest
          - engine: alpine
            dockerfile: Dockerfile.alpine
            image: ghcr.io/1999azzar/ghost-machine-alpine
            suffix: latest
          - engine: arch
            dockerfile: Dockerfile.arch
            image: ghcr.io/1999azzar/ghost-machine-arch
            suffix: latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=${{ matrix.suffix }}
            type=raw,value=${{ matrix.suffix }}-latest
            type=ref,event=tag
            type=sha,prefix=${{ matrix.suffix }}-

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GHOST_USER=developer
            HOST_UID=1000
            HOST_GID=1000
          cache-from: type=gha
          cache-to: type=gha,mode=max
