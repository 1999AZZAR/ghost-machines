name: Ghost Machines CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint & Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Master Test Suite
        run: |
          chmod +x tests/*.sh *.sh
          ./tests/run_all.sh

  dockerfile-smoke-test:
    name: Dockerfile Build Smoke Test (${{ matrix.engine }})
    runs-on: ubuntu-latest
    needs: lint-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: ubuntu
            dockerfile: Dockerfile
            image: ubuntu-template:test
          - engine: debian
            dockerfile: Dockerfile.debian
            image: debian-template:test
          - engine: alpine
            dockerfile: Dockerfile.alpine
            image: alpine-template:test
          - engine: arch
            dockerfile: Dockerfile.arch
            image: arch-template:test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Config
        run: docker compose -f docker-compose.yml config --quiet
        env:
          GHOST_DOCKERFILE: ${{ matrix.dockerfile }}
          GHOST_IMAGE: ${{ matrix.image }}

      - name: Build Distro Image (Smoke Test)
        run: |
          docker build \
            --file ${{ matrix.dockerfile }} \
            --build-arg GHOST_USER=developer \
            --build-arg HOST_UID=1000 \
            --build-arg HOST_GID=1000 \
            --tag ${{ matrix.image }} .
